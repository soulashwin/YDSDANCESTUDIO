name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          A2A50B: ${{ secrets.A2A50B }}
          B720F2: ${{ secrets.B720F2 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A2A50B', '')
          sec_b = os.environ.get('B720F2', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- 16ed7a3a5ced24f44f47cf23fda18f8aaed821e7bbdf -->', sec_a)
          if sec_b:
              after = after.replace('<!-- d1556cccf7ff5a7d1aef2eaab8eef92d825bd2e6 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
